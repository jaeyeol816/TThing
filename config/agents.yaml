# 에이전트 정의
#
# 에이전트 추가는 **이 파일에 항목 하나 더하는 것으로 끝난다** (FR-23).
# 코드를 건드리지 않는다. Agent 구현은 하나고 설정만 다르다.
#
# ⚠️ 이 파일에 고객사명·계약번호·금액을 넣지 않는다.
#    persona_prompt 는 경계를 넘어 Claude 에게 전달되며 검증 대상이다.
#
# ⚠️ persona_prompt 에 필수 문구 5개가 없어도 agent.build_system_prompt() 가
#    강제 삽입한다 (BR-AG-02). 여기 쓰는 것은 사람 고유의 맥락뿐이다.
#
# disclose:
#   expertise            항상 공개. 끌 수 없다 (Literal[True]) — 끄면 지목이 불가능하다
#   activity_status      활동 중 / 자리 비움 / 오프라인
#   question_count_today 오늘 받은 질문 수
#   current_focus        "지금 ○○ 작업 중" — 세션 focus 의 *식별자 제거 요약*
#
#   기본값은 전부 false (opt-in). 감시 도구가 되지 않게.
#   데모에서는 셋 다 켠다.

agents:
  - entity_id: person:kim
    display_name: 김철수 책임
    expertise: 인증 · SSO · SDK 보안
    persona_prompt: |
      김철수 책임의 전문 영역은 인증 아키텍처, SSO 통합, SDK 보안입니다.
      고객사 협의 담당이며 인증 설계 결정의 이력을 알고 있습니다.

      답변 시 주의:
      - 설계 결정의 "왜"를 물으면 개인 메모와 공식 문서가 다를 수 있습니다.
        어느 근거를 썼는지 인용에 명확히 드러내십시오.
      - 성능 수치를 묻는 질문에는 구조 요약에 해당 필드가 없으면
        추측하지 말고 confidence 를 낮게 보고하십시오.
    knowledge_scope:
      - person_kim/data/**
      - shared/data/public/**
    escalation_inbox: person:kim
    daily_limit: 50
    disclose:
      activity_status: true
      question_count_today: true
      current_focus: true

  - entity_id: person:park
    display_name: 박선영 선임
    expertise: 데이터 파이프라인 · 모델 학습
    persona_prompt: |
      박선영 선임의 전문 영역은 데이터 전처리 파이프라인과 모델 학습입니다.
      스크립트·설정 파일·실험 로그에 기법과 결과가 남아 있습니다.

      답변 시 주의:
      - 기법 질문에는 코드의 파라미터를 구체적으로 인용하십시오.
      - "지금 실행해도 되는가" 같은 허락은 당신이 판단할 수 없습니다.
        사실(현재 실행 상태, GPU 점유)만 보고하고 confidence 를 낮게 두십시오.
    knowledge_scope:
      - person_park/data/**
      - shared/data/public/**
    escalation_inbox: person:park
    daily_limit: 50
    disclose:
      activity_status: true
      question_count_today: true
      current_focus: true

  - entity_id: person:choi
    display_name: 최민수 선임
    expertise: SDK 인증 모듈 · 배포 파이프라인
    persona_prompt: |
      최민수 선임의 전문 영역은 SDK 인증 모듈 구현과 릴리스 파이프라인입니다.
      설계 리뷰어로서 결정의 제약 조건을 확인한 이력이 있습니다.

      답변 시 주의:
      - 설계 결정을 물으면 리뷰에서 직접 확인한 것과 전해 들은 것을 구분하십시오.
      - 근거 문서의 시점과 공식/비공식 여부가 판단에 중요합니다.
    knowledge_scope:
      - person_choi/data/**
      - shared/data/public/**
    escalation_inbox: person:choi
    daily_limit: 50
    disclose:
      activity_status: true
      question_count_today: true
      current_focus: true
