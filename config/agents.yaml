# 에이전트 정의
#
# 에이전트 추가는 **이 파일에 항목 하나 더하는 것으로 끝난다** (FR-23).
# 코드를 건드리지 않는다. Agent 구현은 하나고 설정만 다르다.
#
# ⚠️ 이 파일에 고객사명·계약번호·금액을 넣지 않는다.
#    persona_prompt 는 경계를 넘어 Claude 에게 전달되며 검증 대상이다.
#
# ⚠️ persona_prompt 에 필수 문구 5개가 없어도 agent.build_system_prompt() 가
#    강제 삽입한다 (BR-AG-02). 여기 쓰는 것은 사람 고유의 맥락뿐이다.
#
# ──────────────────────────────────────────────────────────────────────
# org — 조직도의 자리
# ──────────────────────────────────────────────────────────────────────
#
#   org.unit   `config/org.yaml` 의 `units[].id`
#   org.rank   `config/org.yaml` 의 `ranks[].id`
#   org.title  직급과 별개인 역할 표기. 비우면 화면이 직급만 그린다
#
# 자리 이름(“VS본부”)을 여기 적지 않는 것이 요점이다. 조직 개편이 일어나면
# `org.yaml` 한 곳만 바뀌고 이 파일은 그대로다. 반대로 사람이 팀을 옮기면
# 여기 `unit` 한 줄만 바뀐다. 두 축이 서로를 건드리지 않는다.
#
# `org` 가 없으면 조직도에 그리지 않고 "미배치" 로 뺀다 — 오타가 나면
# 사람이 조용히 사라지는 대신 눈에 띈다.
#
# ──────────────────────────────────────────────────────────────────────
# topics — 브로드캐스트 판정이 참고하는 키워드
# ──────────────────────────────────────────────────────────────────────
#
# 질문을 전원에게 뿌린 뒤 "내가 답할 수 있는가" 를 각자 판정할 때 쓰는
# 신호다 (`src/mesh/triage.py`). 비워도 동작하며 그때는 `expertise` 문장만
# 으로 판정한다.
#
# ⚠️ 여기 적는 것은 **인증 없이 보이는 화면에 나갈 수 있는 말**이다.
#    고객사명·프로젝트 코드명을 넣지 않는다 (FR-31 과 같은 이유).
#    `triage` 가 로드 시점에 금칙어를 검사한다.
#
# disclose:
#   expertise            항상 공개. 끌 수 없다 (Literal[True]) — 끄면 지목이 불가능하다
#   activity_status      활동 중 / 자리 비움 / 오프라인
#   question_count_today 오늘 받은 질문 수
#   current_focus        "지금 ○○ 작업 중" — 세션 focus 의 *식별자 제거 요약*
#
#   기본값은 전부 false (opt-in). 감시 도구가 되지 않게.
#   데모에서는 셋 다 켠다.

