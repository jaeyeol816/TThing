[project]
name = "mia"
version = "0.1.0"
description = "MIA; But AI got you — 담당자가 자리에 없어도, 기밀은 구조만 경계 밖으로 보내고 답은 나온다"
requires-python = ">=3.12,<3.13"

# 의존성 6개 유지가 설계 목표다 (NFR-M-01).
# 하나 추가할 때마다 다른 컴퓨터에서의 실패 확률이 올라간다.
# 버전은 `make audit` (pip-audit) 결과에 따라 고정한다 (SECURITY-10).
# 초기 선정값(fastapi 0.115.6)은 starlette 0.41.3 을 끌어와 취약점 7건이 나왔다.
# 아래 조합은 취약점 0건으로 확인됨.
dependencies = [
    "fastapi==0.141.1",        # starlette 1.6.0 을 끌어온다 (0.41.3 은 CVE 7건)
    "starlette==1.6.0",        # 명시 고정 — 전이 의존으로 내려가지 않게
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "boto3==1.43.74",          # 1.35 이상 필수 — 구버전은 bedrock 서비스를 모른다 (실측)
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",           # 8.3.4 는 PYSEC-2026-1845
    "pytest-asyncio==1.4.0",
    "hypothesis==6.165.10",
    "pip-audit==2.10.1",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]  # "." — tests.generators 를 패키지로 import 한다
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "S101",  # assert — 테스트에서 쓴다
    "E501",  # line-length 는 formatter 가 관리
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"scripts/*" = ["S603", "S607"]
